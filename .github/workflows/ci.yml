name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (macOS)
    runs-on: macos-latest
    env:
      # `tmux attach` refuses to open a terminal it cannot clear, and the
      # runner sets no TERM, so the attach test would never see a client.
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4

      # The session tests drive a real tmux server; the runner image has no tmux.
      - name: Install tmux
        run: brew install tmux

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The one architectural rule: the desktop shell is an API client (D3).
      - name: D3 boundary
        run: python3 scripts/check-d3-boundary.py

  web:
    name: Desktop frontend (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
