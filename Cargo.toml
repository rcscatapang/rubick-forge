[workspace]
resolver = "2"
members = ["crates/forge-core", "crates/forge-daemon", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ryan Catapang"]

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
